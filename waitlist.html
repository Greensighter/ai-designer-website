<!-- Netlify detects this form at deploy time; the chat posts the same fields to it -->
<form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="waitlist">
  <input name="subject"><input name="bot-field"><input name="first_name"><input name="last_name"><input name="email">
  <input name="website"><input name="team_size"><input name="pm_tool"><input name="designers">
  <input name="status"><input name="answered">
</form>

<header class="ct-top">
  <a class="logo" href="index.html" aria-label="Greensighter home">
    <span class="logo__mark"><img src="assets/img/logo-mark.svg" width="22" height="9" alt=""></span>
    <img src="assets/img/logo-wordmark.svg" width="120" height="19" alt="">
  </a>
  <span class="ct-status"><i aria-hidden="true"></i>Onboarding agent · online</span>
  <a class="ct-mail" href="mailto:hello@greensighter.com">hello@greensighter.com</a>
</header>

<main class="ct" id="ct">
  <div class="ct-progress" id="ct-progress" hidden>
    <div class="ct-progress__head"><span>Your setup</span><span id="ct-count">0 of 6</span></div>
    <div class="ct-progress__bar" id="ct-bar"></div>
    <div class="ct-pills" id="ct-pills"></div>
  </div>

  <section class="ct-intro" id="ct-intro">
    <span class="ct-orb" aria-hidden="true"><img src="assets/img/logo-mark.svg" alt=""></span>
    <h1 class="ct-intro__title">Let’s book your demo.</h1>
    <p class="ct-intro__sub">I’m Greensighter’s onboarding agent. Start with your work email and I’ll take it from there.</p>
  </section>

  <div class="ct-log" id="ct-log" role="log" aria-live="polite"></div>

  <form class="ct-composer" id="ct-composer" autocomplete="on" novalidate>
    <label class="sr-only" for="ct-input">Your answer</label>
    <input id="ct-input" name="ct" type="email" autocomplete="email" placeholder="you@company.com" enterkeyhint="send">
    <button type="submit" class="ct-send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <p class="ct-legal" id="ct-legal">By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
</main>
