# Cloudflare Pages config for ai.greensighter.com
name = "ai-designer-website"
pages_build_output_dir = "./"
compatibility_date = "2026-10-15"

[vars]
# Who receives demo requests (comma-separated)
LEAD_EMAILS = "aram@greensighter.com,david@greensighter.com"
# Sender; greensighter.com is already verified in Resend
LEAD_FROM = "Vlad AI <leads@greensighter.com>"
# SHA-256 of the /quiz-stats password (the password itself is not stored anywhere in the repo)
STATS_PASS_SHA256 = "3bdce40a7bf5ea735bec0a584a09d39647eb323edfcf436b486880f117d58f07"

# Backup copy of every lead (also visible in the Cloudflare dashboard under KV)
[[kv_namespaces]]
binding = "LEADS"
id = "d701bfac588b418387de8b51bfd93eeb"

# Secret, set in the dashboard (Settings > Variables and secrets), never in git:
#   RESEND_API_KEY

# Anonymous quiz step analytics (functions/api/qe.js), shown at /quiz-stats
[[d1_databases]]
binding = "QUIZ_DB"
database_name = "vlad-quiz-analytics"
database_id = "7b176797-ca0c-4675-b371-c1c10b35f979"
